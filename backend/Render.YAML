# Render Blueprint. A persistent disk requires a paid instance, so data (reviews, enquiries, screenshots) survives redeploys.
services:
  - type: web
    name: creavixworld-backend
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SMTP_USER
        value: teamcreavixworld.org@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        value: teamcreavixworld.org@gmail.com
      - key: GEMINI_API_KEY
        sync: false
      - key: EMAIL_FROM_BACKEND
        value: "1"